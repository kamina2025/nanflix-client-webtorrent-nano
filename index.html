<!doctype html>
<html lang="es" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NanFlix P2P Persistent Node MVP</title>

        <script>
            window.tailwind = { config: { suppressWarnings: true } };
        </script>
        <script src="https://cdn.tailwindcss.com"></script>

        <script src="nanocurrency.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
        <link rel="manifest" href="manifest.json" />

        <script src="components/header-bar.js" defer></script>
        <script src="components/sidebar-filters.js" defer></script>
        <script src="components/torrents-table.js" defer></script>
        <script src="components/peerwallets.js" defer></script>

        <script src="components/details-panel.js" defer></script>
        <script src="components/modals-container.js" defer></script>
    </head>
    <body class="bg-slate-950 text-slate-200 h-full flex flex-col font-sans select-none overflow-hidden">
        <nanflix-header></nanflix-header>

        <div class="flex-grow flex overflow-hidden">
            <nanflix-sidebar class="shrink-0 hidden md:block"></nanflix-sidebar>

            <main class="flex-grow flex flex-col min-w-0 bg-slate-950">
                <nanflix-torrents-table class="flex-grow overflow-y-auto"></nanflix-torrents-table>

                <nanflix-details-panel
                    class="h-64 border-t border-slate-800 bg-slate-900/80 flex flex-col shrink-0"></nanflix-details-panel>
            </main>
        </div>
        <!-- MENÚ CONTEXTUAL EXTENDIDO -->
        <div
            id="torrent-context-menu"
            class="fixed hidden bg-slate-900 border border-slate-700/80 rounded-lg shadow-2xl py-1.5 w-60 z-50 text-xs">
            <!-- Sección Básica -->
            <button
                onclick="ejecutarAccionContextMenu('reproducir')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-cyan-950/80 hover:text-cyan-400 flex items-center gap-2 transition-colors">
                ▶️ Reproducir / Ver Media
            </button>
            <button
                onclick="ejecutarAccionContextMenu('guardar_archivo')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-cyan-950/80 hover:text-cyan-400 flex items-center gap-2 transition-colors">
                💾 Descargar Archivo Completo
            </button>
            <button
                onclick="ejecutarAccionContextMenu('compartir')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-cyan-950/80 hover:text-cyan-400 flex items-center gap-2 transition-colors">
                🔗 Copiar Magnet Link
            </button>
            <button
                onclick="ejecutarAccionContextMenu('copiar_infohash')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-cyan-950/80 hover:text-cyan-400 flex items-center gap-2 transition-colors">
                📋 Copiar Solo InfoHash Hex
            </button>

            <div class="border-t border-slate-800 my-1"></div>

            <!-- Sección Control de Red / Seeding -->
            <button
                onclick="ejecutarAccionContextMenu('pausar')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-amber-950/80 hover:text-amber-400 flex items-center gap-2 transition-colors">
                ⏸️ Pausar Seeding
            </button>
            <button
                onclick="ejecutarAccionContextMenu('reanudar')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-emerald-950/80 hover:text-emerald-400 flex items-center gap-2 transition-colors">
                ▶️ Reanudar Seeding
            </button>
            <button
                onclick="ejecutarAccionContextMenu('reannounce')"
                class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-slate-800 hover:text-slate-300 flex items-center gap-2 transition-colors">
                🔄 Forzar Re-Announce (Trackers)
            </button>

            <div class="border-t border-slate-800 my-1"></div>

            <!-- Sección Avanzada & Nano On-Chain -->
            <button
                onclick="ejecutarAccionContextMenu('ver_vale_nano')"
                class="w-full text-left px-3 py-1.5 text-amber-300 hover:bg-amber-950/80 flex items-center gap-2 transition-colors">
                📜 Ver Vale / Micro-transacciones Nano
            </button>
            <button
                onclick="ejecutarAccionContextMenu('ver_creador')"
                class="w-full text-left px-3 py-1.5 text-purple-300 hover:bg-purple-950/80 flex items-center gap-2 transition-colors">
                👤 Ver Billetera de Autor (`nano_...`)
            </button>

            <div class="border-t border-slate-800 my-1"></div>

            <!-- Eliminar -->
            <button
                onclick="ejecutarAccionContextMenu('eliminar')"
                class="w-full text-left px-3 py-1.5 text-rose-400 hover:bg-rose-950/80 hover:text-rose-300 flex items-center gap-2 transition-colors font-medium">
                🗑️ Eliminar Torrent
            </button>
        </div>
        <nanflix-modals></nanflix-modals>

        <script src="opciones-der.js"></script>

        <script src="nano.js"></script>
        <!-- Módulos de WebTorrent -->
        <script src="webtorrent/nano-handshake.js"></script>
        <script src="webtorrent/torrent-control.js"></script>

        <script src="webtorrent/opciones-der.js"></script>
        <script src="webtorrent/console-logs.js"></script>
        <script src="ui-buttons.js"></script>
        <script src="app.js"></script>
    </body>
</html>
